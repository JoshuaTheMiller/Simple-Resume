---
layout: compress
---
<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}"{% if site.dark-mode == "auto" %} class="sr-dark-auto"{% endif %}>        
    <head>
        {% include head.html %}
    </head>    
    <body>                                 
        <header>
            {% if site.in-development %}  
            <p id="under-construction-banner" role="status">This site is currently under construction!</p> 
            {% endif %}
            {% include profile-block.html %}
        </header>        
        <main>
            {{ content }}
        </main>
        <footer>
            {% include site-footer.html %}
        </footer>   
        {% include scripts.html %}
        <button type="button" class="print-button" aria-label="Print this resume" title="Print this resume"><img class="print-button-image" src="{{ '/assets/images/icon_printer.svg' | relative_url }}" alt=""></button>     
        <script type="text/javascript" src="{{ '/assets/js/main.js' | relative_url }}"></script>
    </body>       
</html>
