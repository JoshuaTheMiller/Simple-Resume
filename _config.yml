# Theme defaults. Jekyll 4 merges a gem theme's _config.yml beneath the site's own,
# so a site can override any of these. Settings for this repo's demo site are in
# _config.demo.yml, which only the dev preview and CI load.

plugins:
  - jekyll-seo-tag

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  ignore:
    envs: []
  blanklines: true
  profile: false
  startings: all
