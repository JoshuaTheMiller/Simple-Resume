name: Build

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build the demo site
        run: bundle exec jekyll build --strict_front_matter --config _config.yml,_config.demo.yml
        env:
          JEKYLL_ENV: production

      - name: Check the generated HTML
        # Links, scripts, image alt text and the favicon.
        run: >
          bundle exec htmlproofer ./_site
          --disable-external
          --checks Links,Scripts,Images,Favicon
