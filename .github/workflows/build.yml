name: Build

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build the demo site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
          # GitHub Pages metadata (site.url, site.description) is looked up through the API.
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the generated HTML
        # Links, scripts, image alt text and the favicon.
        run: >
          bundle exec htmlproofer ./_site
          --disable-external
          --checks Links,Scripts,Images,Favicon
